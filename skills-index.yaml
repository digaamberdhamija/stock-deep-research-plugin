- id: stockbee-episodic-pivot-analyzer
  display_name: Stockbee Episodic Pivot Analyzer
  category: advanced-satellite
  status: beta
  operational_role:
    type: standalone
    rationale: "Runs on its own or through the plugin's deep-research skill; the multi-skill workflows it belonged to were removed."
  summary: Analyze Stockbee-style Day 1 Episodic Pivot candidates from earnings, guidance, M&A, FDA,
    analyst, contract, product, short-squeeze, and story/theme catalysts using catalyst quality,
    gap/range expansion, volume shock, neglect/revaluation context, liquidity, and EP-day-low risk.
  timeframe: event-driven
  difficulty: advanced
  integrations:
  - id: catalyst_events_json
    type: local_file
    requirement: required
    note: User-provided or upstream-generated catalyst/event records; the skill does not discover news by itself
  - id: fmp
    type: market_data
    requirement: optional
    note: Optional OHLCV enrichment via Financial Modeling Prep
  - id: local_calculation
    type: calculation
    requirement: not_required
    note: Catalyst classification, EP scoring, handoff flags, and report generation
  inputs:
  - catalyst_events
  - earnings_trade_candidates
  - momentum_burst_candidates
  - daily_ohlcv
  outputs:
  - episodic_pivot_candidates
  - catalyst_quality_scores
  - delayed_ep_watchlist
  - pead_handoff_candidates
  workflows: []
- id: deep-research
  display_name: Deep Research
  category: market-regime
  status: beta
  operational_role:
    type: standalone
    rationale: "User entry point that runs the other news skills in parallel and merges their output into one report."
  summary: Multi-angle news research on a stock, theme, macro event, or the market that runs the
    other news skills in parallel and writes one sourced report with scenarios and trigger levels.
  timeframe: event-driven
  difficulty: intermediate
  integrations:
  - id: websearch
    type: web
    requirement: required
    note: News collection and gap filling via WebSearch / WebFetch
  - id: fmp
    type: market_data
    requirement: optional
    note: Used through the calendar and reaction skills when FMP_API_KEY is set
  inputs:
  - research_question
  outputs:
  - deep_research_report
  workflows: []
