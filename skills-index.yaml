- id: news-reaction-failure-analyzer
  display_name: News Reaction Failure Analyzer
  category: market-regime
  status: production
  verification:
    instruction_contract: not_verified
    unit_tests: passed
    workflow_contract: not_applicable
    end_to_end_replay: not_applicable
    data_provenance: not_verified
    financial_logic_review: not_verified
    empirical_validation: not_verified
    security_review: not_verified
  operational_role:
    type: standalone
    rationale: "Runs on its own or through the plugin's deep-research skill; the multi-skill workflows it belonged to were removed."
  summary: Judges whether a market failed to react to news favorable to a crowded speculative
    position, implementing step 2 of Jason Shapiro's contrarian methodology with a Monte-Carlo-verified
    drift-significance verdict test.
  timeframe: event-driven
  difficulty: intermediate
  integrations:
  - id: fmp
    type: market_data
    requirement: required
    note: Historical EOD price data; per-symbol coverage varies (ETF proxy fallback documented)
  - id: websearch
    type: web
    requirement: required
    note: Events curation (Claude searches news to build the events JSON; no FMP news endpoint exists
      for futures)
  inputs:
  - cot_crowding_report
  - curated_events_json
  outputs:
  - news_failure_verdict
  workflows: []
