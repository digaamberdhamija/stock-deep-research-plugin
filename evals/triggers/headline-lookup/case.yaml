schema_version: "1.1"
name: headline-lookup
description: A quick headline lookup should not trigger deep-research.
tags: [trigger, cheap, negative]
runs: 3
execution:
  model: claude-sonnet-5-5
  prompt: "What's the latest headline on TSLA? Just the headline."
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?deep-research"'
    min: 0
    max: 0
